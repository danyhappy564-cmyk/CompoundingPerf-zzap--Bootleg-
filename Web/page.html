<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CompoundingPerf</title>
<style>
:root{color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--text:#0b0b0b;--text2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
--border:rgba(11,11,11,.10);--accent:#2a78d6;--ok:#1a7f37;--warn:#b7791f;--bad:#cf222e}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--text:#fff;--text2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;
--axis:#383835;--border:rgba(255,255,255,.10);--accent:#3987e5;--ok:#3fb950;--warn:#d29922;--bad:#f85149}}
html,body{margin:0;background:var(--page)}
body{color:var(--text);font:14px/1.5 system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif}
html:lang(ko) body{word-break:keep-all}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px;box-sizing:border-box}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 6px}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 8px}
.sub{color:var(--text2);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin:0 0 20px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}
#lang{margin-left:auto;font-size:12px;padding:5px 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0 0 12px}
.tile{border:1px solid var(--border);border-radius:10px;padding:10px 12px}.lbl{color:var(--text2);font-size:12px}
.val{font-size:20px;font-weight:600}.note{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.alert{border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:8px 12px;margin:0 0 12px}
.msg{min-height:1.5em;margin:8px 0 0;color:var(--text2)}
input[type=number],input[type=search],select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);box-sizing:border-box}
input[type=search]{width:100%;margin:0 0 8px}input[type=number]{width:96px}
input[type=range]{flex:1 1 140px;min-width:120px;accent-color:var(--accent)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,340px);gap:8px 20px;padding:12px 0;border-top:1px solid var(--grid);align-items:start}
.row:first-of-type{border-top:0}
.name{font-weight:600}.desc{color:var(--text2);font-size:13px;white-space:pre-line;margin-top:2px;overflow-wrap:anywhere}
.def{color:var(--muted);font-size:11px;margin-top:4px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}.ctl select{width:100%}
.state{font-size:12px;min-width:4.5em;text-align:right;color:var(--muted)}.state.ok{color:var(--ok)}.state.err{color:var(--bad)}
.reset{font-size:12px;padding:3px 8px}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--axis);border-radius:13px;transition:.15s;cursor:pointer}
.switch span:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--accent)}.switch input:checked+span:before{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
@media (max-width:700px){.row{grid-template-columns:1fr}.ctl{justify-content:flex-start}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>CompoundingPerf</h1><button type="button" id="lang"></button></div>
  <p class="sub" id="intro"></p>
  <div id="alerts"></div>
  <section class="card">
    <h2 id="statusTitle"></h2>
    <div class="tiles" id="tiles"></div>
    <div class="note" id="debugLog"></div>
  </section>
  <input type="search" id="q">
  <p class="msg" id="msg" role="status"></p>
  <div id="list"></div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var lang = 'ko', state = null, rendered = false;
  try { lang = localStorage.getItem('cp-lang') || ''; } catch (e) { lang = ''; }
  function t(ko, en) { return lang === 'en' ? en : ko; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function texts() {
    document.documentElement.lang = lang;
    $('lang').textContent = lang === 'en' ? '한국어' : 'English';
    $('intro').textContent = t('SPT 서버 최적화 모드 CompoundingPerf의 설정입니다. 바꾸면 서버에 바로 적용되고 config.json에 저장됩니다(서버 재시작 필요 없음). 게임 F12의 CompoundingPerf.Client와 같은 설정이고, 게임을 켜지 않아도 바꿀 수 있습니다.',
      'Settings of the SPT server optimisation mod CompoundingPerf. Changes apply on the server at once and are saved to config.json (no server restart). The same settings as CompoundingPerf.Client in the game\'s F12, and they work without the game running.');
    $('statusTitle').textContent = t('서버 상태', 'Server status');
    $('q').placeholder = t('설정 검색 (예: 정리, 압축, 로그)', 'Search settings (e.g. cleanup, compression, log)');
    $('q').setAttribute('aria-label', t('설정 검색', 'Search settings'));
  }

  function status() {
    var s = state;
    $('alerts').innerHTML = s.masterEnabled ? '' : '<div class="alert">' + esc(t('config.json의 MasterEnabled가 false입니다 — 패치가 설치되지 않아 아래 설정은 효과가 없습니다(true로 바꾸고 서버 재시작).',
      'MasterEnabled is false in config.json — no patches are installed, so these settings do nothing (set it to true and restart the server).')) + '</div>';
    var last = lang === 'en' ? (s.lastCleanupEn || s.lastCleanupKo) : s.lastCleanupKo;
    $('tiles').innerHTML = [
      [t('서버 메모리', 'Server memory'), s.processMb.toLocaleString() + ' MB', t('GC 사용 ', 'GC ') + s.committedMb.toLocaleString() + ' MB'],
      [t('마지막 레이드 후 정리', 'Last post-raid cleanup'), last ? last.split(' ')[0] : '-', last ? last.substring(last.indexOf(' ') + 1) : t('아직 없음', 'none yet')],
      [t('서버 모드 버전', 'Server mod version'), s.version, t('원작 EchoStarz · SPT 4.1 비공식 포팅', 'original by EchoStarz · unofficial SPT 4.1 port')]
    ].map(function (x) { return '<div class="tile"><div class="lbl">' + esc(x[0]) + '</div><div class="val">' + esc(x[1]) + '</div><div class="note">' + esc(x[2]) + '</div></div>'; }).join('');
    $('debugLog').textContent = s.debugLog ? t('디버그 로그: ', 'Debug log: ') + s.debugLog : '';
  }

  function label(it, v) {
    if (it.kind === 'bool') return v === 'true' ? t('켜짐', 'on') : t('꺼짐', 'off');
    if (it.kind === 'list') { var i = it.options.indexOf(v); return i >= 0 ? (lang === 'en' ? it.optionsEn : it.optionsKo)[i] : v; }
    return v;
  }

  function control(it) {
    var name = esc(lang === 'en' ? it.nameEn : it.nameKo);
    if (it.kind === 'bool') return '<label class="switch"><input type="checkbox"' + (it.v === 'true' ? ' checked' : '') + ' aria-label="' + name + '"><span></span></label>';
    if (it.kind === 'list') return '<select aria-label="' + name + '">' + it.options.map(function (o, i) {
      return '<option value="' + esc(o) + '"' + (o === it.v ? ' selected' : '') + '>' + esc((lang === 'en' ? it.optionsEn : it.optionsKo)[i]) + '</option>';
    }).join('') + '</select>';
    return '<input type="range" min="' + it.min + '" max="' + it.max + '" step="1" value="' + esc(it.v) + '" aria-label="' + name + '">' +
      '<input type="number" min="' + it.min + '" max="' + it.max + '" step="1" value="' + esc(it.v) + '">';
  }

  function setValue(row, it, v) {
    it.v = v;
    row.querySelectorAll('input,select').forEach(function (el) { if (el.type === 'checkbox') el.checked = v === 'true'; else el.value = v; });
    row.querySelector('.reset').classList.toggle('hidden', v === it.def);
  }

  function save(row, it, v) {
    var st = row.querySelector('.state');
    st.className = 'state'; st.textContent = t('저장 중', 'saving');
    fetch('/compoundingperf/api/set', {
      method: 'POST', cache: 'no-store',
      headers: { 'X-CompoundingPerf': '1', 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'id=' + encodeURIComponent(it.id) + '&value=' + encodeURIComponent(v)
    }).then(function (r) {
      if (r.status === 403 || r.redirected) throw new Error(t('관리자만 바꿀 수 있습니다 (SPT 웹 패널 로그인)', 'Only an administrator can change this (SPT web panel login)'));
      return r.json();
    }).then(function (r) {
      if (!r.ok) { st.className = 'state err'; st.textContent = r.error || t('실패', 'failed'); if (r.v != null) setValue(row, it, r.v); return; }
      setValue(row, it, r.v);
      st.className = 'state ok'; st.textContent = t('✓ 적용됨', '✓ applied');
      $('msg').textContent = r.changes ? t('적용됨', 'Applied') + (r.saved ? t(' · config.json 저장', ' · saved to config.json') : t(' · ⚠ config.json 저장 실패(재시작하면 원래대로)', ' · ⚠ config.json NOT saved (reverts on restart)')) + ': ' + r.changes : '';
      setTimeout(function () { if (st.textContent === t('✓ 적용됨', '✓ applied')) st.textContent = ''; }, 2500);
    }).catch(function (e) { st.className = 'state err'; st.textContent = e.message || t('서버 연결 실패', 'server unreachable'); setValue(row, it, it.v); });
  }

  function render() {
    var groups = {}, order = [];
    state.settings.forEach(function (it) { if (!groups[it.catKo]) { groups[it.catKo] = []; order.push(it.catKo); } groups[it.catKo].push(it); });
    order.sort();
    var list = $('list'); list.innerHTML = '';
    order.forEach(function (cat) {
      var items = groups[cat].slice().sort(function (a, b) { return b.order - a.order; });
      var sec = document.createElement('section'); sec.className = 'card set';
      sec.innerHTML = '<h2>' + esc(lang === 'en' ? items[0].catEn : items[0].catKo) + '</h2>';
      items.forEach(function (it) {
        var row = document.createElement('div'); row.className = 'row';
        row.setAttribute('data-q', [it.catKo, it.catEn, it.nameKo, it.nameEn, it.descKo, it.descEn].join(' ').toLowerCase());
        row.innerHTML = '<div><div class="name">' + esc(lang === 'en' ? it.nameEn : it.nameKo) + '</div><div class="desc">' + esc(lang === 'en' ? it.descEn : it.descKo) +
          '</div><div class="def">' + esc(t('기본값: ', 'Default: ') + label(it, it.def)) + '</div></div><div class="ctl">' + control(it) +
          '<button type="button" class="reset' + (it.v === it.def ? ' hidden' : '') + '">' + esc(t('기본값으로', 'Reset')) + '</button><span class="state"></span></div>';
        row.querySelectorAll('input,select').forEach(function (el) {
          if (el.type === 'range') { var num = row.querySelector('input[type=number]'); el.addEventListener('input', function () { num.value = el.value; }); }
          el.addEventListener('change', function () { save(row, it, el.type === 'checkbox' ? (el.checked ? 'true' : 'false') : el.value); });
        });
        row.querySelector('.reset').addEventListener('click', function () { save(row, it, it.def); });
        sec.appendChild(row);
      });
      list.appendChild(sec);
    });
    filter();
  }

  function filter() {
    var q = $('q').value.trim().toLowerCase();
    document.querySelectorAll('.set').forEach(function (sec) {
      var any = false;
      sec.querySelectorAll('.row').forEach(function (row) { var show = !q || row.getAttribute('data-q').indexOf(q) >= 0; row.classList.toggle('hidden', !show); any = any || show; });
      sec.classList.toggle('hidden', !any);
    });
  }

  function load(full) {
    return fetch('/compoundingperf/api/state', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
      state = s;
      if (!lang) lang = s.lang || 'ko';
      if (!rendered || full) { texts(); render(); rendered = true; }
      status();
    }).catch(function () { $('msg').textContent = t('서버에 연결할 수 없습니다.', 'Cannot reach the server.'); });
  }

  $('lang').addEventListener('click', function () {
    lang = lang === 'en' ? 'ko' : 'en';
    try { localStorage.setItem('cp-lang', lang); } catch (e) { /* private mode */ }
    texts(); render(); status();
  });
  $('q').addEventListener('input', filter);
  load(true);
  setInterval(function () { if (!document.hidden) load(false); }, 5000);
})();
</script>
</body>
</html>
